name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, main]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Format
        run: terraform fmt -check -recursive infra/${{ matrix.stack }}

      - name: Validate
        working-directory: infra/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Checkov (Terraform misconfigurations)
        run: |
          pip install checkov==3.3.26
          checkov -d infra --framework terraform --compact --quiet --skip-download

      - name: Trivy (secrets and vulnerable dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
