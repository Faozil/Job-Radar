name: Deploy

# Repository variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, ALERT_EMAIL (optional).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "infra/main/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unit tests
        working-directory: .
        run: |
          pip install -r requirements-dev.txt
          pytest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        run: >-
          terraform plan -input=false -out=tfplan
          -var="region=${{ vars.AWS_REGION }}"
          -var="alert_email=${{ vars.ALERT_EMAIL }}"

      - name: Apply
        run: terraform apply -input=false tfplan
