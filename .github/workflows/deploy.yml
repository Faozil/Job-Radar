name: Deploy

# Needs the "production" environment with the secrets EMAIL_ADDRESS, EMAIL_APP_PASSWORD and,
# optionally, ALERT_EMAIL, plus the repository variables AWS_REGION, AWS_DEPLOY_ROLE_ARN and
# TF_STATE_BUCKET. See the README.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "infra/main/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unit tests
        working-directory: .
        run: |
          pip install -r requirements-dev.txt
          pytest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # The secrets go only to the two Terraform steps. Ephemeral variables are never saved in
      # the plan file, so the apply step needs them again.
      - name: Plan
        env:
          TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
          TF_VAR_email_app_password: ${{ secrets.EMAIL_APP_PASSWORD }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -input=false -out=tfplan -var="region=${{ vars.AWS_REGION }}"

      - name: Apply
        env:
          TF_VAR_email_address: ${{ secrets.EMAIL_ADDRESS }}
          TF_VAR_email_app_password: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: terraform apply -input=false tfplan
