[filters]
max_age_days = 45  # feeds only: company boards list open jobs, some for years
drop_if_sponsorship_excluded = true
skip_german_ads = true

# Python regexes, case-insensitive. A title needs one include match and no exclude match.
# Junior, mid and senior roles all pass; staff level and above don't.
title_include = [
  '\bdev\s?-?(sec)?ops\b',
  '\b(ml|llm)\s?-?ops\b',
  '\bsite[\s-]reliability\b',
  '\bsre\b',
  '\bplatform\s+(engineer|engineering|reliability|infrastructure)',
  '\binfrastructure\s+(engineer|developer|platform|operations|automation)',
  '\bcloud\s+(security\s+)?(engineer|infrastructure|platform|operations|support\s+engineer|field\s+engineer|developer|architect)',
  '\b(aws|azure|gcp|google\s+cloud)\s+(cloud\s+)?(engineer|architect|administrator|specialist)\b',
  '\bengineer\b[^|]*\binfrastructure\b',
  '\b(linux|unix|systems?)[\s-]?administrator\b',
  '\bsysadmin\b',
  '^(?=.*\blinux\b).*\b(engineer|specialist)\b',
  # "Systems engineer" on its own is often aerospace or medical work, so it needs an IT word too.
  '^(?=.*\b(it|linux|unix|windows|cloud|infrastructure|network|networking|hosting|web|platform|servers?|storage|devops|vmware|email)\b).*\bsystems?[\s-]?engineer\b',
  '\b(kubernetes|k8s)\b',
  '\b(release|build|ci/?cd)\s+engineer',
  '\b(production|observability|reliability)\s+engineer\b',
]

title_exclude = [
  '\b(staff|principal|distinguished)\b',
  '\b(head|director|vp|vice\s+president|chief)\b',
  '\bmanager\b',
  '\b(intern|internship|working\s+student|werkstudent|praktik\w*|apprentice\w*)\b',
  '\b(freelance|freelancer)\b',  # self-employed work comes with no visa
  '\b(sales|presales|pre-sales|account\s+executive|business\s+development|alliances?|marketing|recruit\w*)\b',
  '\bsolutions?\s+(engineer|architect|consultant)\b',
  '\b(embedded|firmware|hardware|electrical|mechanical|avionics|aerospace)\b',
  '\b(mobile|ios|android|react\s+native|frontend|front-end)\b',
]

