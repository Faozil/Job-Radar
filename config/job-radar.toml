# Flagged in the digest, not dropped.
flag_languages = ["german", "dutch", "lithuanian", "romanian", "polish"]

# Job feeds that list many employers. Set enabled = false to turn one off.
[feeds.arbeitnow]
pages = 3

# Germany's federal job board, without recruitment and temp agencies.
[feeds.bundesagentur]
searches = ["DevOps", "Site Reliability", "Cloud Engineer", "Platform Engineer", "Kubernetes", "Infrastructure Engineer", "Linux Administrator"]
days = 1  # ads since yesterday; the API only takes 0, 1, 7, 14 or 28

